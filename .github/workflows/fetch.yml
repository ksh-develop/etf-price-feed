name: fetch-prices
on:
  schedule:
    - cron: "40 21 * * 1-5"   # 06:40 KST (화~토) - 미국 정규장 마감 후
    - cron: "40 22 * * 1-5"   # 07:40 KST 재시도
    - cron: "10 23 * * 1-5"   # 08:10 KST 재시도 (브리핑 8:30 전)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: fetch-prices, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance==0.2.66 pandas requests
      - run: python scripts/fetch.py
      - name: commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "prices $(date -u +%F)" && git push
