name: fetch-prices
on:
  schedule:
    # GitHub 예약 실행은 보통 30~60분 늦게 시작되므로 일찍 걸어 둔다
    - cron: "15 21 * * 1-5"   # 06:15 KST (화~토) - 미국 정규장 마감(06:00, 서머타임 05:00) 후
    - cron: "45 21 * * 1-5"   # 06:45 KST 재시도
    - cron: "30 22 * * 1-5"   # 07:30 KST 재시도
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: fetch-prices, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance==0.2.66 pandas requests
      - run: python scripts/fetch.py
      - name: commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "prices $(date -u +%F)" && git push
